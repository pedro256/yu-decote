services:
  yudecote-api:
    container_name: yudecote-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Configurações de conexão para o SDK do .NET conversar com o container do MinIO
      - MinIO__ServiceURL=http://minio:9000
      - MinIO__AccessKey=yudecote_admin
      - MinIO__SecretKey=yudecote_secure_password_2026
      - MinIO__BucketName=videos-cortados
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - yudecote-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: yudecote-minio
    ports:
      - "9000:9000" # Porta da API S3 (onde seu .NET vai fazer o upload por Pipe)
      - "9001:9001" # Porta do Console Web (Painel Visual para você gerenciar os Buckets)
    environment:
      MINIO_ROOT_USER: yudecote_admin
      MINIO_ROOT_PASSWORD: yudecote_secure_password_2026
    volumes:
      - minio-data:/data
    # Comando obrigatório para inicializar o servidor MinIO apontando o painel web para a porta correta
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - yudecote-network

volumes:
  minio-data:
    driver: local

networks:
  yudecote-network:
    driver: bridge